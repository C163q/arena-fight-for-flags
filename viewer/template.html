<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fight for Flags · 回放</title>
<style>
:root{color-scheme:dark;--bg:#0b1117;--panel:#141e28;--edge:#2a3a48;--text:#e4edf4;--dim:#91a5b5;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{padding:22px 30px 16px;border-bottom:1px solid var(--edge)}h1{font-size:23px;letter-spacing:.02em;margin:0 0 4px}p{margin:0;color:var(--dim)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;padding:20px 30px}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:16px}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}button,input,select{font:inherit;color:inherit;background:#1b2b38;border:1px solid #3b5060;border-radius:6px;padding:7px 11px}button{cursor:pointer}button:hover{background:#2d4558}button:disabled{opacity:.35;cursor:default}#play{background:#347968;border-color:#4aab90}#turn{flex:1;min-width:140px;padding:0;accent-color:#68c8a9}#jump{width:88px}#board{width:100%;max-height:74vh;display:block;background:#0e1821;border-radius:7px}.muted{color:var(--dim);font-size:12px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}#turnLabel{font-size:19px;font-weight:700}.team{border-left:4px solid var(--team);background:#101a23;padding:9px 12px;border-radius:5px;margin:7px 0;display:flex;justify-content:space-between;gap:12px}.team b{font-size:21px}.team-name{max-width:240px;overflow-wrap:anywhere}.section-title{font-size:12px;color:var(--dim);letter-spacing:.08em;margin:16px 0 7px}#units{max-height:260px;overflow:auto}.unit{display:flex;justify-content:space-between;border-bottom:1px solid #24323f;padding:5px 0;font:12px ui-monospace,monospace}.events{max-height:440px;overflow:auto;font-size:12px}details{padding:8px 0;border-bottom:1px solid #283845}summary{cursor:pointer;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#b8c8d4}.tag{display:inline-block;color:#adc3d4;font-size:10px;border:1px solid #405263;border-radius:4px;padding:0 4px;margin-right:6px}#warning{color:var(--gold)}label{display:flex;align-items:center;gap:5px}.below{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}@media(max-width:950px){.layout{grid-template-columns:1fr;padding:14px}header{padding:18px}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:14px}#board{max-height:65vh}}@media(max-width:560px){.sidebar{display:block}.layout{padding:10px}.panel{padding:10px}.controls{gap:6px}}
</style>
</head>
<body>
<header><h1>Fight for Flags <span class="muted">/ 比赛回放</span></h1><p id="meta"></p><p id="warning"></p></header>
<div class="layout">
<main class="panel">
<div class="topline"><span id="turnLabel"></span><span id="result" class="muted"></span></div>
<div class="controls">
<button id="prev" aria-label="上一回合">←</button><button id="play">播放</button><button id="next" aria-label="下一回合">→</button>
<input id="turn" type="range" min="0" value="0" aria-label="回合滑块"><input id="jump" type="number" min="0" value="0" aria-label="指定回合">
<select id="speed" aria-label="播放速度"><option value="1">1 回合/秒</option><option value="2" selected>2 回合/秒</option><option value="4">4 回合/秒</option><option value="8">8 回合/秒</option></select>
<select id="phase" aria-label="局面阶段"><option value="end">回合结束</option><option value="start">回合开始</option></select>
</div>
<svg id="board" role="img" aria-label="夺旗棋盘"></svg>
<div class="below muted"><label><input id="shots" type="checkbox" checked>射击路径（移动前）</label><span>⚑ 携旗 · 血量格显示剩余生命</span><span id="frameNote"></span></div>
</main>
<aside class="sidebar"><section class="panel"><div class="section-title">队伍与比分</div><div id="scores"></div><div class="section-title">棋子状态</div><div id="units"></div><div class="section-title">AI 调用</div><div id="calls" class="muted"></div></section>
<section class="panel" style="margin-top:14px"><div class="section-title">本回合事件 · 点击查看原始明细</div><div id="events" class="events"></div></section></aside>
</div>
<script id="replay-data" type="application/json">__REPLAY_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('replay-data').textContent);
const $=id=>document.getElementById(id), colors=['#67c9a5','#f48175','#79aef2','#d09cf2','#f0bd65','#6fd2df','#ed94be','#a8c66e'];
const last=data.records.length; let turn=0,timer=null;
$('turn').max=last;$('jump').max=last;
$('meta').textContent=`${data.map.id} · ${data.map.width} × ${data.map.height} · ${data.map.players} 队 · 种子 ${data.manifest.seed}`;
if(data.manifest.status!=='complete')$('warning').textContent='记录未完成：当前仅包含已完整写入的回合。';
function svg(name,attrs,text){const element=document.createElementNS('http://www.w3.org/2000/svg',name);for(const[k,v]of Object.entries(attrs||{}))element.setAttribute(k,String(v));if(text!==undefined)element.textContent=text;$('board').append(element);return element;}
function label(id){return id?String.fromCharCode(65+id.team_id*3+id.unit_id):'—';}
function pos(p){return p?`(${p.x},${p.y})`:'—';}
function flags(id){return id===null||id===undefined?'无旗':`⚑${id}`;}
function eventText(e){switch(e.type){
case 'shot':return `${label(e.shooter)} → ${pos(e.target)} · ${e.result==='hit'?`命中 ${label(e.hit_unit)}，伤害 ${e.damage}`:e.result==='blocked'?'障碍遮挡':e.result==='miss'?'落空':`未执行：${e.validation}`}`;
case 'hp_change':return `${label(e.unit)} 血量 ${e.before} → ${e.after}`;
case 'death':return `${label(e.unit)} 死亡，计划第 ${e.respawn_at_turn} 回合复活`;
case 'move':return `${label(e.unit)} ${pos(e.from)} → ${pos(e.target)} · ${e.result==='moved'?'移动成功':e.reason}`;
case 'carry_change':return `${label(e.unit)} ${flags(e.before)} → ${flags(e.after)} · ${e.reason}`;
case 'score':return `队伍 ${e.team_id} 得分 ${e.before} → ${e.after}`;
case 'flag_spawned':return `旗点 ${e.site_id} 生成旗 ${e.flag_id} ${pos(e.position)}`;
case 'flag_spawn_failed':return `旗点 ${e.site_id} 生成失败：${label(e.occupant)} 已携旗`;
case 'flag_respawn_scheduled':return `旗点 ${e.site_id} 等待 ${e.delay} 回合，第 ${e.next_attempt_turn} 回合移动后尝试`;
case 'respawn':return `${label(e.unit)} 复活 ${pos(e.position)}`;
case 'respawn_blocked':return `${label(e.unit)} 出生区已满，延后复活`;
default:return e.type;}}
function render(){
const record=turn?data.records[turn-1]:null, state=record?( $('phase').value==='start'?record.frame.start:record.frame.end):data.initial;
$('turn').value=turn;$('jump').value=turn;$('turnLabel').textContent=turn?`第 ${turn} / ${last} 回合`:'初始局面 · 回合 0';$('prev').disabled=turn===0;$('next').disabled=turn===last;
$('frameNote').textContent=turn?($('phase').value==='start'?'AI 决策前局面':'移动、生成与得分结算后局面'):'';
$('result').textContent=state.outcome?(state.outcome.winners.length===1?`队伍 ${state.outcome.winners[0]} 获胜`:`平局：队伍 ${state.outcome.winners.join('、')}`):'';
const size=32;$('board').setAttribute('viewBox',`0 0 ${data.map.width*size} ${data.map.height*size}`);$('board').replaceChildren();
for(let y=0;y<data.map.height;y++)for(let x=0;x<data.map.width;x++)svg('rect',{x:x*size,y:y*size,width:size,height:size,fill:data.map.terrain[y][x]==='#'?'#344555':'#15232e',stroke:'#233440','stroke-width':.7});
for(const h of data.map.spawn_regions){svg('rect',{x:h.x*size,y:h.y*size,width:h.width*size,height:h.height*size,fill:colors[h.team_id],opacity:.15,stroke:colors[h.team_id],'stroke-width':2});svg('text',{x:(h.x+.15)*size,y:(h.y+.45)*size,fill:colors[h.team_id],'font-size':11},`HOME ${h.team_id}`);}
for(const point of data.map.flag_points){const circle=svg('circle',{cx:(point.x+.5)*size,cy:(point.y+.5)*size,r:11,fill:'none',stroke:'#f0bd65','stroke-width':1.5,'stroke-dasharray':'3 2'});const title=document.createElementNS(circle.namespaceURI,'title');const site=state.sites.find(s=>s.site_id===point.id);title.textContent=`旗点 ${point.id}`+(site?.active_flag_id?` · 关联旗 ${site.active_flag_id}`:site?.next_attempt_turn?` · 第 ${site.next_attempt_turn} 回合尝试`:'');circle.append(title);}
for(const flag of state.flags)if(flag.location.state==='ground'){const p=flag.location.position;svg('text',{x:(p.x+.5)*size,y:(p.y+.73)*size,fill:'#ffd166','font-size':24,'text-anchor':'middle'},'⚑');}
for(const u of state.units)if(u.position){const p=u.position,cx=(p.x+.5)*size,cy=(p.y+.47)*size;svg('circle',{cx,cy,r:11,fill:colors[u.id.team_id],stroke:'#071018','stroke-width':1.5});svg('text',{x:cx,y:cy+4,fill:'#101a22','font-size':13,'font-weight':800,'text-anchor':'middle'},label(u.id));for(let i=0;i<3;i++)svg('rect',{x:cx-9+i*6.5,y:cy+13,width:5,height:3,rx:1,fill:i<u.hp?colors[u.id.team_id]:'#43535f'});if(u.carrying!==null)svg('text',{x:cx+6,y:cy-7,fill:'#ffe28a','font-size':16},'⚑');}
if(record&&$('shots').checked&&$('phase').value==='end')for(const e of record.frame.events)if(e.type==='shot'&&e.validation==='ok'&&e.from&&e.target){const p=e.blocked_by||e.target;svg('line',{x1:(e.from.x+.5)*size,y1:(e.from.y+.5)*size,x2:(p.x+.5)*size,y2:(p.y+.5)*size,stroke:e.result==='hit'?'#fff1b3':'#a5b3c1','stroke-width':2,opacity:.8,'stroke-dasharray':e.result==='hit'?'none':'4 3'});svg('circle',{cx:(e.target.x+.5)*size,cy:(e.target.y+.5)*size,r:6,fill:'none',stroke:'#ffe49c','stroke-width':1.4});}
$('scores').replaceChildren();for(const team of data.manifest.teams){const row=document.createElement('div');row.className='team';row.style.setProperty('--team',colors[team.team_id]);const name=document.createElement('span');name.className='team-name';name.textContent=`${team.team_id} · ${team.name}`;const score=document.createElement('b');score.textContent=state.scores[team.team_id];row.append(name,score);$('scores').append(row);}
$('units').replaceChildren();for(const u of state.units){const row=document.createElement('div');row.className='unit';const left=document.createElement('span');left.textContent=`${label(u.id)} · ${pos(u.position)}`;left.style.color=colors[u.id.team_id];const right=document.createElement('span');right.textContent=u.position?`HP ${u.hp}/3 · ${flags(u.carrying)}`:`死亡 · 第${u.respawn_at_turn}回合复活`;row.append(left,right);$('units').append(row);}
$('calls').replaceChildren();for(const c of record?.calls||[]){const row=document.createElement('div');row.textContent=`队 ${c.team_id} · ${c.status} · ${(c.elapsed_us/1000).toFixed(2)} ms`+(c.init_elapsed_us?` · 初始化 ${(c.init_elapsed_us/1000).toFixed(1)} ms`:'');$('calls').append(row);}
$('events').replaceChildren();for(const e of record?.frame.events||[]){const details=document.createElement('details'),summary=document.createElement('summary'),tag=document.createElement('span'),body=document.createElement('pre');tag.className='tag';tag.textContent=e.phase;summary.append(tag,document.createTextNode(eventText(e)));body.textContent=JSON.stringify(e,null,2);details.append(summary,body);$('events').append(details);}if(!record?.frame.events.length)$('events').textContent=turn?'本回合无事件':'初始随机出生与旗帜布局';
}
function pause(){if(timer)clearInterval(timer);timer=null;$('play').textContent='播放';}
function jump(value){turn=Math.max(0,Math.min(last,Math.floor(Number(value)||0)));render();}
$('prev').onclick=()=>{pause();jump(turn-1);};$('next').onclick=()=>{pause();jump(turn+1);};
$('turn').oninput=event=>{pause();jump(event.target.value);};$('jump').onchange=event=>{pause();jump(event.target.value);};
$('play').onclick=()=>{if(timer){pause();return;}if(turn===last)jump(0);$('play').textContent='暂停';timer=setInterval(()=>{if(turn>=last){pause();return;}jump(turn+1);if(turn===last)pause();},1000/Number($('speed').value));};
$('speed').onchange=()=>{if(timer){pause();$('play').click();}};$('phase').onchange=render;$('shots').onchange=render;
document.addEventListener('keydown',event=>{if(['INPUT','SELECT'].includes(event.target.tagName))return;if(event.key==='ArrowRight')$('next').click();if(event.key==='ArrowLeft')$('prev').click();if(event.code==='Space'){event.preventDefault();$('play').click();}});
render();
</script>
</body></html>
