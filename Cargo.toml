[workspace]
members = ["crates/engine", "crates/replay", "crates/ai-worker", "crates/runner", "crates/ai-abi", "crates/ai-sdk", "bots/wait", "bots/greedy", "bots/baseline", "bots/sparring", "bots/test-fixture", "crates/session-timer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ron = "=0.12.2"
libloading = "=0.8.9"
libc = "=0.2.190"
sha2 = "=0.10.9"

